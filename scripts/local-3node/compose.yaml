services:
  node-a-db:
    image: mysql:8.4
    container_name: agritrace-local3node-db-a
    environment:
      MYSQL_DATABASE: agritrace
      MYSQL_USER: agritrace_app
      MYSQL_PASSWORD_FILE: /run/secrets/node_a_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/node_a_root_password
    ports:
      - "127.0.0.1:${NODE_A_DB_PORT:-3307}:3306"
    volumes:
      - node-a-data:/var/lib/mysql
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    secrets: [node_a_app_password, node_a_root_password]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    labels: { com.agritrace.local3node: "true", com.agritrace.node: "A" }
  node-b-db:
    image: mysql:8.4
    container_name: agritrace-local3node-db-b
    environment:
      MYSQL_DATABASE: agritrace
      MYSQL_USER: agritrace_app
      MYSQL_PASSWORD_FILE: /run/secrets/node_b_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/node_b_root_password
    ports:
      - "127.0.0.1:${NODE_B_DB_PORT:-3308}:3306"
    volumes:
      - node-b-data:/var/lib/mysql
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    secrets: [node_b_app_password, node_b_root_password]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    labels: { com.agritrace.local3node: "true", com.agritrace.node: "B" }
  node-c-db:
    image: mysql:8.4
    container_name: agritrace-local3node-db-c
    environment:
      MYSQL_DATABASE: agritrace
      MYSQL_USER: agritrace_app
      MYSQL_PASSWORD_FILE: /run/secrets/node_c_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/node_c_root_password
    ports:
      - "127.0.0.1:${NODE_C_DB_PORT:-3309}:3306"
    volumes:
      - node-c-data:/var/lib/mysql
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    secrets: [node_c_app_password, node_c_root_password]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    labels: { com.agritrace.local3node: "true", com.agritrace.node: "C" }
secrets:
  node_a_app_password: { file: ${AGRITRACE_LOCAL3NODE_SECRET_DIR:?Set secret directory}/node-a-app-password.txt }
  node_a_root_password: { file: ${AGRITRACE_LOCAL3NODE_SECRET_DIR:?Set secret directory}/node-a-root-password.txt }
  node_b_app_password: { file: ${AGRITRACE_LOCAL3NODE_SECRET_DIR:?Set secret directory}/node-b-app-password.txt }
  node_b_root_password: { file: ${AGRITRACE_LOCAL3NODE_SECRET_DIR:?Set secret directory}/node-b-root-password.txt }
  node_c_app_password: { file: ${AGRITRACE_LOCAL3NODE_SECRET_DIR:?Set secret directory}/node-c-app-password.txt }
  node_c_root_password: { file: ${AGRITRACE_LOCAL3NODE_SECRET_DIR:?Set secret directory}/node-c-root-password.txt }
volumes:
  node-a-data: { name: agritrace-local3node-node-a-db }
  node-b-data: { name: agritrace-local3node-node-b-db }
  node-c-data: { name: agritrace-local3node-node-c-db }